<html lang="en">

    <title>Offline · Smart HR</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;

        color: #e2e8f0;

      a {
        display: inline-block; padding: 10px 20px; border-radius: 10px;
        background: #2563eb; color: #fff; text-decoration: none; font-weight: 600;
      }

  <body>
